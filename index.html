<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Helix Smash — JS Helix Tower Game</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    header { text-align: center; margin-bottom: 1rem; }
    header h1 { font-size: 1.875rem; font-weight: 800; }
    header p { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; }
    .game-container {
      position: relative;
      width: 100%;
      max-width: 384px;
      aspect-ratio: 9 / 16;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    canvas { width: 100%; height: 100%; touch-action: none; user-select: none; }
    .hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 1rem; font-weight: bold; font-size: 0.875rem;
      color: #fff; mix-blend-mode: difference; pointer-events: none;
    }
    .overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      text-align: center; gap: 0.5rem; pointer-events: none;
    }
    .overlay h2 { font-size: 1.5rem; font-weight: 800; }
    .overlay p { max-width: 16rem; font-size: 0.875rem; opacity: 0.85; }
    .overlay .btn-sub { margin-top: 0.5rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; }
  </style>
</head>
<body>
  <header>
    <h1>Helix Smash</h1>
    <p>Drag to rotate · hold to smash · dodge the black blocks</p>
  </header>
  <div class="game-container">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <span id="levelHud">LEVEL 1</span>
      <span id="scoreHud">0</span>
    </div>
    <div class="overlay" id="overlay">
      <h2 id="titleText">Helix Smash</h2>
      <p>Drag to rotate the tower, hold to smash. Avoid the black blocks.</p>
      <p class="btn-sub" id="btnText">Tap to start</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const levelHud = document.getElementById("levelHud");
    const scoreHud = document.getElementById("scoreHud");
    const overlay = document.getElementById("overlay");
    const titleText = document.getElementById("titleText");
    const btnText = document.getElementById("btnText");

    const SLOTS = 16, LEVELS = 60, LEVEL_GAP = 62, RX = 118, RY = 34, INNER = 0.34, THICK = 16, GRAVITY = 0.55, BOUNCE = -11, SMASH_SPEED = 17;
    const PALETTES = [
      { a: "#37d3f5", b: "#5ce6a5", block: "#2f6df6", dark: "#15171c" },
      { a: "#ff8a3d", b: "#ff4f81", block: "#ffd400", dark: "#15171c" },
      { a: "#7b5cff", b: "#ff7bd5", block: "#2ecc4a", dark: "#15171c" },
      { a: "#ff5f4d", b: "#ffb43d", block: "#e6392b", dark: "#15171c" }
    ];

    function shade(hex, amt) {
      const n = parseInt(hex.replace("#", ""), 16);
      const clamp = v => Math.max(0, Math.min(255, Math.round(v)));
      return `rgb(${clamp(((n >> 16) & 255) * (1 + amt))},${clamp(((n >> 8) & 255) * (1 + amt))},${clamp((n & 255) * (1 + amt))})`;
    }

    function makeLevels() {
      const out = [];
      for (let i = 0; i < LEVELS; i++) {
        const slots = new Array(SLOTS).fill(1);
        const holeSize = 3 + Math.floor(Math.random() * 2);
        const holeStart = Math.floor(Math.random() * SLOTS);
        for (let h = 0; h < holeSize; h++) slots[(holeStart + h) % SLOTS] = 0;
        if (i > 2 && Math.random() < 0.75) {
          const dSize = 2 + Math.floor(Math.random() * 3);
          const dStart = Math.floor(Math.random() * SLOTS);
          for (let d = 0; d < dSize; d++) {
            const idx = (dStart + d) % SLOTS;
            if (slots[idx] === 1) slots[idx] = 2;
          }
        }
        out.push({ slots, destroyed: false });
      }
      out[out.length - 1].slots = new Array(SLOTS).fill(1);
      return out;
    }

    let W = 0, H = 0;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      W = r.width; H = r.height;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    let levels = makeLevels(), rot = 0, rotVel = 0, ballY = -80, vy = 0, camY = -260;
    let smashing = false, score = 0, cleared = 0, state = "ready", shake = 0;
    const shards = [];
    const pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];

    function updateDOM(newScore, newLevel, newState) {
      scoreHud.textContent = newScore;
      levelHud.textContent = `LEVEL ${newLevel}`;
      if (newState === "play") {
        overlay.style.display = "none";
      } else {
        overlay.style.display = "flex";
        titleText.textContent = newState === "ready" ? "Helix Smash" : newState === "win" ? "You Win!" : "Game Over";
        btnText.textContent = `Tap to ${newState === "ready" ? "start" : "retry"}`;
      }
    }

    function reset() {
      levels = makeLevels(); rot = 0; rotVel = 0; ballY = -80; vy = 0; camY = -260;
      score = 0; cleared = 0; shards.length = 0; state = "play";
      updateDOM(0, 1, "play");
    }

    let dragging = false, lastX = 0;
    canvas.addEventListener("pointerdown", e => {
      canvas.setPointerCapture(e.pointerId);
      if (state !== "play") { reset(); return; }
      dragging = true; lastX = e.clientX; smashing = true;
    });
    canvas.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - lastX; lastX = e.clientX;
      rotVel = -dx * 0.012;
      if (Math.abs(dx) > 12) smashing = false;
    });
    window.addEventListener("pointerup", () => { dragging = false; smashing = false; });

    const cx = () => W / 2, baseY = () => H * 0.42, screenY = worldY => baseY() + (worldY - camY);
    const frontSlot = () => {
      const step = (Math.PI * 2) / SLOTS;
      let a = Math.PI / 2 - rot;
      a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      return Math.floor(a / step) % SLOTS;
    };

    const burst = (y, color) => {
      for (let i = 0; i < 16; i++) {
        shards.push({
          x: cx() + (Math.random() - 0.5) * RX * 1.6, y: screenY(y),
          vx: (Math.random() - 0.5) * 9, vy: -Math.random() * 6 - 1,
          r: 4 + Math.random() * 7, c: color, life: 1
        });
      }
    };

    function drawSegment(yTop, from, to, color) {
      const steps = 10;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const a = from + ((to - from) * i) / steps;
        ctx.lineTo(cx() + Math.cos(a) * RX, yTop + Math.sin(a) * RY);
      }
      for (let i = steps; i >= 0; i--) {
        const a = from + ((to - from) * i) / steps;
        ctx.lineTo(cx() + Math.cos(a) * RX, yTop + Math.sin(a) * RY + THICK);
      }
      ctx.closePath(); ctx.fillStyle = shade(color, -0.28); ctx.fill();

      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const a = from + ((to - from) * i) / steps;
        ctx.lineTo(cx() + Math.cos(a) * RX, yTop + Math.sin(a) * RY);
      }
      for (let i = steps; i >= 0; i--) {
        const a = from + ((to - from) * i) / steps;
        ctx.lineTo(cx() + Math.cos(a) * RX * INNER, yTop + Math.sin(a) * RY * INNER);
      }
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
    }

    function drawPoleSlice(yTop, h) {
      const r = RX * INNER;
      const g = ctx.createLinearGradient(cx() - r, 0, cx() + r, 0);
      g.addColorStop(0, "#d9dde3"); g.addColorStop(0.35, "#ffffff"); g.addColorStop(1, "#c3c9d2");
      ctx.fillStyle = g; ctx.fillRect(cx() - r, yTop, r * 2, h);
    }

    function loop() {
      rot += rotVel; rotVel *= 0.9; shake *= 0.85;
      for (let i = shards.length - 1; i >= 0; i--) {
        const p = shards[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.6; p.life -= 0.03;
        if (p.life <= 0) shards.splice(i, 1);
      }

      if (state === "play") {
        const prevY = ballY;
        if (smashing) vy = Math.max(vy, SMASH_SPEED);
        vy += GRAVITY; ballY += vy;

        if (vy > 0) {
          for (let li = 0; li < levels.length; li++) {
            const lv = levels[li];
            if (lv.destroyed) continue;
            const ly = li * LEVEL_GAP;
            if (prevY <= ly && ballY >= ly) {
              const slot = lv.slots[frontSlot()];
              if (slot === 0) break;
              if (smashing) {
                if (slot === 2) {
                  state = "over"; shake = 14; burst(ly, pal.dark); updateDOM(score, cleared + 1, "over"); break;
                }
                lv.destroyed = true; cleared++; score += 10; shake = 8; burst(ly, pal.block); updateDOM(score, cleared + 1, "play"); continue;
              }
              if (slot === 2) {
                state = "over"; shake = 14; updateDOM(score, cleared + 1, "over"); break;
              }
              ballY = ly - 1; vy = BOUNCE; break;
            }
          }
        }
        if (ballY > (levels.length - 1) * LEVEL_GAP + 40) {
          state = "win"; updateDOM(score + 100, cleared, "win");
        }
        camY += (ballY - 120 - camY) * 0.12;
      }

      // Drawing
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, pal.a); g.addColorStop(1, pal.b);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      ctx.save();
      if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

      drawPoleSlice(0, H);

      const step = (Math.PI * 2) / SLOTS;
      for (let li = 0; li < levels.length; li++) {
        const lv = levels[li];
        if (lv.destroyed) continue;
        const y = screenY(li * LEVEL_GAP);
        if (y < -60 || y > H + 60) continue;

        const segs = [];
        for (let s = 0; s < SLOTS; s++) {
          if (lv.slots[s] === 0) continue;
          const from = s * step + rot, to = from + step;
          segs.push({ from, to, color: lv.slots[s] === 2 ? pal.dark : pal.block, depth: Math.sin((from + to) / 2) });
        }
        segs.sort((p, q) => p.depth - q.depth);
        segs.forEach(s => drawSegment(y, s.from, s.to, s.color));
      }

      for (const p of shards) {
        ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r * 0.6);
      }
      ctx.globalAlpha = 1;

      const by = screenY(ballY), br = 15;
      ctx.beginPath(); ctx.ellipse(cx(), by + br + 4, br * 0.9, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.fill();

      const bg = ctx.createRadialGradient(cx() - 5, by - 6, 2, cx(), by, br);
      bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.35, "#6fd3ff"); bg.addColorStop(1, "#1274d8");
      ctx.beginPath(); ctx.arc(cx(), by, br, 0, Math.PI * 2); ctx.fillStyle = bg; ctx.fill();

      if (smashing && state === "play") {
        ctx.beginPath();
        ctx.moveTo(cx() - 9, by - 6);
        ctx.lineTo(cx(), by - 40 - Math.random() * 14);
        ctx.lineTo(cx() + 9, by - 6);
        ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,0.65)"; ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
